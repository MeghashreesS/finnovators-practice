<!DOCTYPE html>
<html>
<head>
  <title>Finnovators</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Finnovators</a>
      {% if user %}
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/expenses">Expenses</a></li>
          <li class="nav-item"><a class="nav-link" href="/loans">Loans</a></li>
          <li class="nav-item"><a class="nav-link" href="/calendar">Calendar</a></li>
          <li class="nav-item"><a class="nav-link" href="/recommendation">Repay?</a></li>
        </ul>
        <span class="text-white">
          {{ user['name'] }} |
          <a class="text-white" href="/logout">Logout</a>
        </span>
      </div>
      {% endif %}
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
