{% extends "base.html" %}
{% block content %}
<h2>Choose a user to continue</h2>
<form method="POST" class="mt-3">
  {% for u in users %}
  <button type="submit" name="user_id" value="{{ u['id'] }}" class="btn btn-outline-primary me-2 mb-2">
    {{ u['name'] }}
  </button>
  {% endfor %}
</form>
{% endblock %}
